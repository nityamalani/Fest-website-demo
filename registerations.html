<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registerations</title>
</head>

<body>
  <header>
  <img src="https://www.iimb.ac.in/sites/default/files/inline-images/IIMB-Logo.png" alt="IIMB-Logo" height="40">
  <h1> IIMB Fest 2026 </h1>
  <p>Welcome to the fest we hope you have a great time</p>
<nav>
    <a href="./home.html">click here to go back to the home page</a>
</nav>


</header>
<main>

<section>
  <h2>Register for the fest</h2>

  <form action="/register">
    
    <label for="name"> Enter your name </label>
      <input type="text" name="name" id="name" required minlength="2" maxlength="12">
      <br><br>
    <label for="email"> Please enter your email</label>
      <input type="email" name="email"  id="email" required>
      <br><br>
    <label for="t_shirt_size">Select T shirt size</label>
  <select name="t_shirt_size" id="t_shirt_size">
      <option value="">Please select the option</option>
      <option value="XS">XS</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
  </select>
  <br><br>
  <label for="checkbox1">Do you agree to the conditions?</label>
    <input type="checkbox" name="tnc" id="checkbox1" required>
  <br><br>
  <label for="alumni">Alumni:</label>
    <input type="radio" name="attendee_type" id="alumni" value="alumni">
  <label for="student">Student:</label>
    <input type="radio" name="attendee_type" id="student" value="student">

    <button type="submit">Register</button>
  </form>
</section>

</main>


</body>

</html>
